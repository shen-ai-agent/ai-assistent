# Cấu hình voice server. Đường dẫn tương đối tính từ gốc repo.

[server]
host = "127.0.0.1"
port = 8765
# Điện thoại cùng Wi-Fi mở https://<IP máy>:8766 (chứng chỉ tự ký, tạo theo README). 0 = tắt.
# Không có đăng nhập: máy nào trong mạng LAN cũng dùng được; đừng port-forward cổng này ra Internet.
lan_port = 8766

[stt]
# Chọn theo benchmark Phase 1 (_local/stt_report.md)
model = "large-v3"
compute_type = "int8_float16"
device = "cuda"
language = "vi"
beam_size = 5
min_audio_ms = 300        # ngắn hơn thì coi là bấm nhầm
min_speech_ms = 200       # VAD thấy ít tiếng nói hơn thì bỏ qua lượt (0 = tắt), tránh Whisper bịa câu
max_audio_s = 120         # dài hơn thì cắt, tránh giữ phím quên thả

[tts]
# Chọn theo benchmark Phase 3 (_local/tts_report.md)
enabled = true
voice = "maichi"          # baotrang giahuy hamy huuduc kimoanh maichi quangminh tiendat
device = "cuda"           # cần onnxruntime-gpu 1.23.2 (xem README); "cpu" thì RTF ~1, dễ khựng
threads = 4
loanwords = false         # true: dùng cả phiên âm từ tiếng Anh (dòng ~ trong data/lexicon.tsv)
first_chunk_frames = 2    # mẩu 160ms từ đầu: không giật ở bench không STT (_local/tts_chunk)
max_chunk_frames = 2

[bridge]
# claude_cli: gọi `claude -p` (Claude Code, dùng gói subscription đã đăng nhập), giữ ngữ cảnh bằng --resume
# clipboard: chép transcript vào clipboard; copy câu trả lời từ Claude Desktop/web rồi bấm hotkey để nghe
# none: chỉ STT + TTS
kind = "claude_cli"
auto_ask = true           # nhận dạng xong thì tự hỏi; false = chỉ hỏi khi bấm "Hỏi Claude"
hotkey = "ctrl+alt+r"     # chỉ dùng cho clipboard
workdir = "_local/claude-workdir"   # Claude chạy ở đây, không thấy code dự án
prompt = "prompts/voice_reply.md"
tools = ["WebSearch", "WebFetch"]
model = ""                # rỗng = mặc định của Claude Code; đổi được trên web (mất khi restart server)
models = ["sonnet", "opus", "haiku"]   # alias của claude --model, hiện trong ô chọn trên web
timeout_s = 120
generate_timeout_s = 60    # message generate: lượt claude -p độc lập cho game TikTok Live World
log_dir = "_local/sessions"

[assistant]
# Chế độ rảnh tay (T-010): bật bằng nút mic trên tab Mimi. Gọi tên ở đầu câu ("Mimi ơi", "hey Mimi")
name = "Mimi"
aliases = ["mi mi"]       # cách Whisper hay viết sai tên (đã tự bỏ dấu, gộp chữ lặp, y = i)
acks = ["Có mình đây.", "Dạ?", "Mình nghe nè.", "Bạn cần gì nè?", "Ơi, mình đây."]   # đừng chứa tên: loa dội vào mic sẽ tự đánh thức
wake_min_score = 0.8
wake_prompt = "Hey Mimi. Mimi ơi."   # wake_bench 16/10: recall 94% (không prompt 88%), nhận nhầm như nhau 2%; đổi tên thì sửa cả dòng này
wake_window_s = 3.0
min_rest_words = 2        # "Mimi ơi, EC2 là gì" nói liền: hỏi luôn
ack_grace_ms = 300        # chỉ gọi tên: chờ thêm chừng này trước khi đáp, nói tiếp thì coi là câu hỏi
sleep_silence_ms = 500
active_silence_ms = 900
active_timeout_s = 8
follow_up_s = 6           # 0 = lần nào cũng phải gọi tên

[agent]
# Giao việc cho VS Code (T-011): "mở dự án job hay rồi thêm phân trang..." → mở VS Code ở thư mục dự án,
# đưa yêu cầu vào ô chat Claude Code, theo dõi log phiên (~/.claude/projects) để báo tiến độ và báo cáo.
# Biệt danh / loại trừ dự án: _local/projects.toml (exclude = [...], [aliases], [extra]).
enabled = true
roots = ["D:/projects", "E:/projects"]
projects_file = "_local/projects.toml"
claude_dir = ""           # rỗng = ~/.claude/projects
code_exe = ""             # rỗng = lệnh `code` trong PATH
auto_submit = true        # tự nhấn Enter vào ô chat (chỉ khi cửa sổ VS Code đúng dự án đang ở trên cùng)
window_wait_s = 15        # chờ cửa sổ VS Code hiện ra
stall_s = 12              # tool chưa xong quá chừng này: báo "chờ duyệt hoặc chạy lâu"
submit_timeout_s = 600    # chỉ điền sẵn: chờ bạn bấm Enter chừng này
task_timeout_s = 7200
log_dir = "_local/tasks"

[study]
# Tab Học (T-012): dán text hoặc tải .txt/.md/.docx, Mimi đọc hiểu rồi giảng lại từng phần.
# Mỗi tài liệu một thư mục trong dir (doc.md, meta.json, history.jsonl) và một session Claude riêng.
# Dùng lệnh claude và model của [bridge].
dir = "_local/study"
prompt = "prompts/study_reply.md"
tools = ["Read", "WebSearch", "WebFetch"]   # Read: đọc doc.md trong thư mục tài liệu
timeout_s = 300
max_chars = 200000

[log]
dir = "_local/logs"
save_audio = true         # lưu wav từng lượt để benchmark lại audio đi qua trình duyệt
